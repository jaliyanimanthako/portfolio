<svg xmlns="http://www.w3.org/2000/svg" class="research-scene scene-visible " viewBox="0 0 400 300" role="img" aria-label="A researcher wearing an EEG cap as brain signals move across a monitor."><style>.research-scene{--scene-paper:#fefdf9;--scene-ink:#202020;--scene-sage:#e9dcff;--scene-olive:#7952b3;display:block;width:100%;height:auto;overflow:visible;fill:none;stroke:var(--scene-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.research-scene .paper{fill:var(--scene-paper)}.research-scene .sage{fill:var(--scene-sage)}.research-scene .ink{fill:var(--scene-ink);stroke:none}.research-scene .olive{fill:var(--scene-olive);stroke:none}.research-scene .wash{fill:var(--scene-sage);stroke:none;opacity:.45}.research-scene .line{fill:none}.research-scene .fine{stroke-width:1.4}.research-scene .light-line{stroke:var(--scene-paper);stroke-width:1.3}.research-scene .dashed{stroke-dasharray:3 6;opacity:.4}
.research-scene .drift{animation:research-drift 7s ease-in-out infinite}.research-scene .drift-slow{animation:research-drift 9s -3s ease-in-out infinite}.research-scene .blink{transform-box:fill-box;transform-origin:center;animation:research-blink 6s infinite}.research-scene .trace{animation:research-trace 7s linear infinite;stroke:var(--scene-olive);stroke-width:1.7}.research-scene .write-hand{transform-origin:244px 260px;animation:research-write 5s ease-in-out infinite}.research-scene .steam{animation:research-steam 5s ease-in-out infinite}.research-scene .electrode{animation:research-electrode 5s var(--delay,0s) ease-in-out infinite}.research-scene .message{animation:research-drift 8s ease-in-out infinite}.research-scene .wave{transform-origin:185px 151px;animation:research-wave 7s ease-in-out infinite}
.research-scene:not(.scene-visible) *{animation-play-state:paused!important}
@keyframes research-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes research-blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}
@keyframes research-trace{to{transform:translateX(92px)}}
@keyframes research-write{0%,15%,65%,100%{transform:rotate(0)}25%,45%{transform:rotate(-3deg)}35%,55%{transform:rotate(2deg)}}
@keyframes research-steam{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:.8;transform:translateY(-3px)}}
@keyframes research-electrode{0%,70%,100%{fill:var(--scene-paper)}30%{fill:var(--scene-olive)}}
@keyframes research-wave{0%,12%,40%,100%{transform:rotate(0)}19%,31%{transform:rotate(8deg)}25%,36%{transform:rotate(-5deg)}}
@media(prefers-reduced-motion:reduce){.research-scene *{animation:none!important}}
[data-motion="paused"] .research-scene *{animation-play-state:paused!important}
</style><ellipse class="wash" cx="190" cy="166" rx="144" ry="109"></ellipse><g transform="translate(258 80)"><rect class="paper" width="106" height="69" rx="5"></rect><path class="line fine" d="M0 16 H106"></path><circle class="ink" cx="9" cy="8" r="2"></circle><circle class="sage" cx="17" cy="8" r="2"></circle><clipPath id="_R_2_"><rect x="7" y="20" width="92" height="40"></rect></clipPath><g clip-path="url(#_R_2_)"><path class="line trace" d="M-92 43 L-79 41 L-72 48 L-64 28 L-55 55 L-47 38 L-37 44 L-25 41 L-18 47 L-10 35 L0 43 L13 41 L20 48 L28 28 L37 55 L45 38 L55 44 L67 41 L74 47 L82 35 L92 43 L105 41 L112 48 L120 28 L129 55 L137 38 L147 44 L159 41 L166 47 L174 35 L184 43"></path></g></g><path class="line fine dashed" d="M258 115 Q232 90 210 108 M283 150 V211 H242"></path><g transform="translate(0 8)"><g transform="translate(161 120) rotate(-7)"><path class="paper" d="M-12 24 L-13 45 Q0 56 16 43 L13 20"></path><path class="paper" d="M-28 -10 Q-31 -38 1 -39 Q31 -35 28 -6 L34 7 L25 12 Q23 35 7 36 Q-15 36 -22 13"></path><path class="ink" d="M-27 12 Q-44 -4 -33 -23 Q-40 -37 -21 -43 Q-20 -60 -5 -53 Q5 -64 15 -49 Q35 -52 36 -32 Q35 -18 22 -15 L5 -21 Q-3 -8 -16 -10 L-19 8 Z"></path><path class="paper" d="M-18 2 Q-33 -7 -32 8 Q-31 20 -20 17"></path><path class="line fine" d="M-26 5 L-22 10 M10 24 Q17 27 21 21 M3 -7 Q8 -11 13 -7"></path><g class="blink"><ellipse class="ink" cx="12" cy="2" rx="2" ry="3.1"></ellipse></g><path class="line fine" d="M-14 -34 Q-3 -42 9 -36 M-26 -25 Q-20 -33 -13 -32"></path></g><path class="line" d="M126 112 C115 55 187 38 197 95"></path><circle class="paper electrode" style="--delay:0s" cx="126" cy="91" r="5"></circle><circle class="paper electrode" style="--delay:0.7s" cx="141" cy="70" r="5"></circle><circle class="paper electrode" style="--delay:1.4s" cx="166" cy="65" r="5"></circle><circle class="paper electrode" style="--delay:2.0999999999999996s" cx="187" cy="76" r="5"></circle><circle class="paper electrode" style="--delay:2.8s" cx="195" cy="94" r="5"></circle><path class="sage" d="M143 164 Q119 165 109 188 L91 264 H240 L218 189 Q205 166 179 163 Q161 181 143 164Z"></path><path class="line fine" d="M130 197 L119 250 M203 199 L215 250 M143 171 Q159 189 181 171"></path><path class="paper" d="M100 237 Q112 232 122 240 L150 253 L195 251 L199 264 L143 268Z"></path></g><path class="line" d="M55 274 H355"></path><path class="line fine" d="M67 105 H81 M74 98 V112"></path><path class="line fine" d="M314 220 H324 M319 215 V225"></path><path class="line fine" d="M213 119 Q230 121 231 138 M220 111 Q241 114 242 136"></path></svg>
