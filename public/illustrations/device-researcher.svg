<rect class="paper" x="232" y="139" width="16" height="26" rx="1"></rect></g><path class="paper" d="M214 177 L224 170 Q235 163 238 169 L228 183 L221 190Z"></path><g class="message"><path class="paper" d="M260 87 H333 Q340 87 340 95 V126 Q340 134 333 134 H277 L263 147 V134 H260 Q253 134 253 126 V95 Q253 87 260 87Z"></path><path class="line fine" d="M265 103 H326 M265 113 H309 M265 122 H318"></path></g><path class="line fine" d="M74 115 H88 M81 108 V122"></path><path class="line fine" d="M308 182 H318 M313 177 V187"></path></svg>
