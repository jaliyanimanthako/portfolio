<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jaliya Nimantha Showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..800&family=DM+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0d0d;overflow:hidden}
  canvas{position:absolute;inset:0;margin:auto;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:100vw;height:auto}
  #play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 18px "DM Mono",monospace;color:#fefdf9;letter-spacing:.2em;cursor:pointer;background:rgba(0,0,0,.35)}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="play">▶ PLAY SHOWREEL</div>
<script>
// ───────────────────────────── core ─────────────────────────────
const W = 1920, H = 1080, FPS = 60, DUR = 60;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  paper: '#fefdf9', ink: '#202020', dark: '#151515', panel: '#1b1b1b',
  purple: '#7952b3', lav: '#e9dcff', lavD: '#b9a0e6', muted: '#6e6c68', mutedD: '#8d8a85',
};
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};

function h1(i) {
  let x = Math.imul(i | 0, 0x27d4eb2d) ^ 0x165667b1;
  x ^= x >>> 15; x = Math.imul(x, 0x85ebca6b);
  x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967295;
}
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(h1(i), h1(i + 1), u) * 2 - 1; }
const fbm = x => noise1(x) * .6 + noise1(x * 2.13 + 13.7) * .3 + noise1(x * 4.37 + 71.1) * .1;

// ───────────────────────────── drawing helpers ─────────────────────────────
const SANS = '"DM Sans", Arial, sans-serif', MONO = '"DM Mono", monospace';
function font(size, weight = 400, fam = SANS) { ctx.font = `${weight} ${size}px ${fam}`; }
function bg(col) { ctx.fillStyle = col; ctx.fillRect(-80, -80, W + 160, H + 160); }
function circle(x, y, r, col) { if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); }
function ring(x, y, r, col, lw = 2) { if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, { size = 24, weight = 400, fam = SANS, color = C.ink, align = 'left', ls = 0, base = 'alphabetic', alpha = 1 } = {}) {
  if (alpha <= 0) return 0;
  font(size, weight, fam); ctx.letterSpacing = ls + 'px';
  ctx.textAlign = align; ctx.textBaseline = base; ctx.fillStyle = color;
  const ga = ctx.globalAlpha; ctx.globalAlpha = ga * alpha;
  ctx.fillText(s, x, y);
  ctx.globalAlpha = ga;
  const w = ctx.measureText(s).width; ctx.letterSpacing = '0px'; ctx.textBaseline = 'alphabetic';
  return w;
}
function measure(s, size, weight = 400, fam = SANS, ls = 0) { font(size, weight, fam); ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.letterSpacing = '0px'; return w; }
const typed = (s, t, t0, cps = 30) => s.slice(0, clamp(Math.floor((t - t0) * cps), 0, s.length));
function wrap(s, maxW, size, weight = 400, fam = SANS) {
  font(size, weight, fam); const out = []; let line = '';
  for (const w of s.split(' ')) { const tryL = line ? line + ' ' + w : w; if (ctx.measureText(tryL).width > maxW && line) { out.push(line); line = w; } else line = tryL; }
  if (line) out.push(line); return out;
}

// Per-character masked rise; returns the string width.
function riseText(s, x, y, o) {
  const { t, t0, size, weight = 600, color, fam = SANS, stagger = .03, dur = .7, out = 1e9, outStagger = .018, outDur = .42, align = 'left', ls = 0, i0 = 0 } = o;
  font(size, weight, fam); ctx.letterSpacing = ls + 'px';
  const total = ctx.measureText(s).width;
  const x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - size, y - size * 1.02, total + size * 2, size * 1.34); ctx.clip();
  ctx.fillStyle = color; ctx.textAlign = 'left';
  for (let i = 0; i < s.length; i++) {
    if (s[i] === ' ') continue;
    const k = i + i0;
    const pin = E.outExpo(P(t, t0 + k * stagger, t0 + k * stagger + dur));
    const pout = E.inExpo(P(t, out + k * outStagger, out + k * outStagger + outDur));
    if (pin <= 0 || pout >= 1) continue;
    ctx.fillText(s[i], x0 + ctx.measureText(s.slice(0, i)).width, y + (1 - pin) * size * 1.15 - pout * size * 1.25);
  }
  ctx.restore(); ctx.letterSpacing = '0px';
  return total;
}
// Whole-line masked rise (for sentences).
function riseLine(s, x, y, o) {
  const { t, t0, dur = .7, out = 1e9, outDur = .4, size, align = 'left' } = o;
  const pin = E.outExpo(P(t, t0, t0 + dur)), pout = E.inExpo(P(t, out, out + outDur));
  if (pin <= 0 || pout >= 1) return 0;
  const w = measure(s, size, o.weight, o.fam, o.ls);
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 20, y - size * 1.05, w + 40, size * 1.4); ctx.clip();
  text(s, x, y + (1 - pin) * size * 1.2 - pout * size * 1.3, o);
  ctx.restore();
  return w;
}
function pill(x, y, s, { size = 20, fam = MONO, weight = 500, h = 40, padX = 18, fill = null, stroke = null, color = C.paper, ls = 1, lw = 1.5 } = {}) {
  const w = measure(s, size, weight, fam, ls) + padX * 2;
  rrect(x, y, w, h, h / 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  text(s, x + padX, y + h / 2 + 1, { size, fam, weight, color, ls, base: 'middle' });
  return w;
}
function dotGrid(sp, col, ox = 0, oy = 0) {
  ctx.fillStyle = col;
  for (let y = (oy % sp) + sp / 2; y < H; y += sp) for (let x = (ox % sp) + sp / 2; x < W; x += sp) ctx.fillRect(x - 1, y - 1, 2, 2);
}
function polyline(pts, col, lw) {
  if (pts.length < 2) return;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
}
const bez = (p0, c, p1, s) => [(1 - s) * (1 - s) * p0[0] + 2 * (1 - s) * s * c[0] + s * s * p1[0], (1 - s) * (1 - s) * p0[1] + 2 * (1 - s) * s * c[1] + s * s * p1[1]];
const cbez = (a, b, c, d, s) => { const m = 1 - s; return [m*m*m*a[0] + 3*m*m*s*b[0] + 3*m*s*s*c[0] + s*s*s*d[0], m*m*m*a[1] + 3*m*m*s*b[1] + 3*m*s*s*c[1] + s*s*s*d[1]]; };
function withAlpha(a, fn) { if (a <= 0) return; const g = ctx.globalAlpha; ctx.globalAlpha = g * a; fn(); ctx.globalAlpha = g; }

// ───────────────────────────── 00 BOOT (0–6) ─────────────────────────────
function sBoot(t) {
  bg(C.dark);
  dotGrid(48, rgba(C.paper, .07 * E.outCubic(P(t, 1.6, 3.0))));
  const cx = W / 2, cy = H / 2;
  const appear = E.outBack(P(t, .3, .8));
  const s = E.inOutExpo(P(t, 1.0, 2.1));
  const col = E.inExpo(P(t, 5.1, 5.55));

  if (s <= 0) {
    circle(cx, cy, 12 * appear, C.lavD);
    const pr = P(t, .35, 1.1);
    ring(cx, cy, 12 + E.outCubic(pr) * 90, rgba(C.lav, .5 * (1 - pr)), 1.5);
  } else {
    const half = lerp(6, 780, s) * (1 - col);
    const noiseAmt = 1 - E.inOutCubic(P(t, 2.3, 3.9));
    const amp = lerp(0, 105, E.outCubic(P(t, 2.0, 3.2))) * (1 + .55 * E.inOutCubic(P(t, 4.2, 5.0)));
    const freq = lerp(.012, .021, E.inOutCubic(P(t, 4.2, 5.1)));
    const fr = Math.floor(t * FPS);
    for (let k = 2; k >= 0; k--) {
      const pts = [];
      for (let x = cx - half; x <= cx + half; x += 3) {
        const u = (x - (cx - half)) / (2 * half);
        const win = Math.pow(Math.sin(Math.PI * u), .7);
        const clean = amp * Math.sin((x - cx) * freq - t * 6 - k * .55);
        const nz = noiseAmt * (fbm(x * .045 + t * 14 + k * 3) * 70 + (h1(Math.floor(x / 3) + fr * 977 + k * 31) - .5) * 46);
        pts.push([x, cy + win * (clean + nz)]);
      }
      polyline(pts, k === 0 ? C.lav : rgba(C.lavD, k === 1 ? .4 : .18), k === 0 ? 3 : 2);
    }
    circle(cx - half, cy, 5, C.lav); circle(cx + half, cy, 5, C.lav);

    const ra = P(t, 2.0, 2.4) * (1 - P(t, 5.0, 5.3));
    const filtered = noiseAmt < .35;
    text(filtered ? 'CH-01  ·  FILTERED' : 'CH-01  ·  RAW SIGNAL', cx - 780, cy - 210, { size: 18, fam: MONO, color: C.paper, ls: 3, alpha: .6 * ra });
    text(`SNR  ${lerp(2.1, 38.4, 1 - noiseAmt).toFixed(1)} dB`, cx + 780, cy - 210, { size: 18, fam: MONO, color: filtered ? C.lav : C.paper, ls: 3, align: 'right', alpha: .75 * ra });
    ctx.fillStyle = rgba(C.paper, .12 * ra);
    for (let i = 0; i <= 26; i++) ctx.fillRect(cx - 780 + i * 60, cy + 190, 1, i % 5 ? 8 : 16);
  }
  const msg = '> from noise, to signal, to insight';
  const ta = 1 - P(t, 5.1, 5.4);
  const shown = typed(msg, t, 3.0, 26);
  if (t > 2.8 && ta > 0) {
    const w = measure(msg, 30, 400, MONO);
    const x0 = cx - w / 2;
    const sw = text(shown, x0, cy + 300, { size: 30, fam: MONO, color: C.paper, alpha: ta });
    if (Math.floor(t * 3) % 2 === 0 || shown.length < msg.length) withAlpha(ta, () => { ctx.fillStyle = C.lavD; ctx.fillRect(x0 + sw + 6, cy + 276, 15, 30); });
  }
}

// ───────────────────────────── 01 HELLO (6–12) ─────────────────────────────
const NET = (() => {
  const layers = [3, 5, 5, 3, 1], cx = 1490, cy = 520, nodes = [], edges = [];
  layers.forEach((n, li) => { for (let j = 0; j < n; j++) nodes.push({ li, x: cx + (li - 2) * 115, y: cy + (j - (n - 1) / 2) * 70 }); });
  let base = 0;
  for (let li = 0; li < layers.length - 1; li++) {
    const nb = base + layers[li];
    for (let a = 0; a < layers[li]; a++) for (let b = 0; b < layers[li + 1]; b++) edges.push({ li, a: nodes[base + a], b: nodes[nb + b] });
    base = nb;
  }
  return { nodes, edges, cx, cy };
})();
const ROLES = ['Deep Learning', 'Computer Vision', 'Explainable AI', 'HCI', 'Brain–Computer Interfaces', 'On-device LLMs', 'AI Agents', 'Human-centered AI'];

function sHello(t) {
  bg(C.paper);
  dotGrid(48, rgba(C.ink, .06));
  const ex = E.inExpo(P(t, 11.4, 11.8));
  const { cx, cy } = NET;
  const dr = E.outExpo(P(t, 6.15, 7.3)) * (300 + 6 * Math.sin(t * 2)) * (1 - ex);
  circle(cx, cy, dr, C.lav);

  ctx.save(); ctx.translate(cx, cy); ctx.scale(1 - ex, 1 - ex); ctx.translate(-cx, -cy);
  // orbit ring
  const op = E.inOutCubic(P(t, 6.5, 7.5));
  if (op > 0) {
    ctx.beginPath(); ctx.ellipse(cx, cy, 380, 118, -.35, -Math.PI / 2, -Math.PI / 2 + op * Math.PI * 2);
    ctx.strokeStyle = rgba(C.ink, .45); ctx.lineWidth = 2; ctx.stroke();
    const a = t * 1.3, ox = 380 * Math.cos(a), oy = 118 * Math.sin(a);
    circle(cx + ox * Math.cos(-.35) - oy * Math.sin(-.35), cy + ox * Math.sin(-.35) + oy * Math.cos(-.35), 9 * op, C.purple);
  }
  // network
  NET.edges.forEach((e, i) => {
    const p = E.outCubic(P(t, 6.7 + e.li * .16, 7.1 + e.li * .16));
    if (p <= 0) return;
    ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(lerp(e.a.x, e.b.x, p), lerp(e.a.y, e.b.y, p));
    ctx.strokeStyle = rgba(C.ink, .2); ctx.lineWidth = 1.5; ctx.stroke();
    if (t > 7.6 && h1(i * 31 + 7) > .58) {
      const ph = (t * 1.15 + h1(i * 17)) % 1;
      circle(lerp(e.a.x, e.b.x, ph), lerp(e.a.y, e.b.y, ph), 4, C.purple);
    }
  });
  NET.nodes.forEach((n, i) => {
    const p = E.outBack(P(t, 6.6 + n.li * .12, 6.95 + n.li * .12));
    if (p <= 0) return;
    const act = t > 7.6 && (n.li === 4 || noise1(t * 2.6 + i * 7.3) > .3);
    circle(n.x, n.y, 13 * p, act ? C.purple : C.paper);
    ring(n.x, n.y, 13 * p, C.ink, 2.5);
  });
  ctx.restore();

  // copy
  const out = 11.35;
  if (t < out + .2) text(typed("Hi, I'm", t, 6.3, 18), 150, 300, { size: 32, fam: MONO, color: C.muted, ls: 2, alpha: 1 - P(t, out, out + .2) });
  riseText('Jaliya', 150, 500, { t, t0: 6.35, size: 190, weight: 600, color: C.ink, stagger: .035, out, ls: -4 });
  riseText('Nimantha.', 150, 690, { t, t0: 6.55, size: 190, weight: 600, color: C.purple, stagger: .035, out: out + .05, ls: -4 });
  const lp = E.inOutExpo(P(t, 6.95, 7.6)) * (1 - E.inExpo(P(t, out, out + .35)));
  ctx.fillStyle = C.ink; ctx.fillRect(150, 760, 720 * lp, 2);

  const fixed = 'Research Engineer  /  ';
  const fw = riseLine(fixed, 150, 845, { t, t0: 7.3, size: 40, weight: 500, color: C.ink, out: out + .05 });
  if (t > 7.6 && t < out + .5) {
    const rx = 150 + fw, slot = (t - 7.7) / .5;
    const pa = 1 - P(t, out + .05, out + .4);
    ctx.save(); ctx.beginPath(); ctx.rect(rx - 4, 795, 900, 66); ctx.clip();
    for (let i = 0; i < ROLES.length; i++) {
      const st = 7.7 + i * .5, p = E.outExpo(P(t, st, st + .28));
      const next = i < ROLES.length - 1 ? E.outExpo(P(t, st + .5, st + .78)) : 0;
      if (p <= 0 || next >= 1) continue;
      text(ROLES[i], rx, 845 + (1 - p) * 60 - next * 60, { size: 40, weight: 500, color: C.purple, alpha: pa });
    }
    ctx.restore();
    if (slot < 0) text('…', rx, 845, { size: 40, color: C.purple });
  }
  text('B.SC. ENG (HONS) E&TC · UNIVERSITY OF MORATUWA   →   AUGMENTED HUMAN LAB · NUS', 150, 935,
    { size: 18, fam: MONO, color: C.muted, ls: 2, alpha: P(t, 7.9, 8.4) * (1 - P(t, out, out + .2)) });
}

// ───────────────────────────── 02 PHILOSOPHY (12–18) ─────────────────────────────
function sPhilo(t) {
  bg(C.dark);
  if (t < 15.2) {
    const z = 1 + .05 * P(t, 12, 15);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
    const L = [
      { s: 'Technology', t0: 12.05, c: C.paper },
      { s: 'should be', t0: 12.5, c: C.paper },
      { s: 'understood,', t0: 13.0, c: C.paper, hl: true },
      { s: 'not just used.', t0: 13.75, c: '#5f5d5a' },
    ];
    const ys = [330, 480, 630, 780], size = 128;
    L.forEach((l, i) => {
      const out = 14.6 + i * .06;
      if (l.hl) {
        const w = measure(l.s, size, 600, SANS, -3);
        const p = E.inOutExpo(P(t, 13.2, 13.65)), q = E.inExpo(P(t, out, out + .3));
        const bwF = w + 110, bw = bwF * p, x0 = W / 2 - bwF / 2;
        ctx.fillStyle = C.purple; ctx.fillRect(x0 + bwF * q, ys[i] - size * .82, Math.max(0, bw - bwF * q), size * 1.08);
      }
      riseText(l.s, W / 2, ys[i], { t, t0: l.t0, size, weight: 600, color: l.c, align: 'center', stagger: .022, dur: .55, out, ls: -3 });
    });
    ctx.restore();
  }
  if (t >= 14.9) venn(t);
}
function venn(t) {
  const cx = 960, cy = 500, r = 220;
  const vp = E.outExpo(P(t, 15.0, 16.0));
  const d = lerp(560, 135, vp);
  const angs = [-Math.PI / 2, Math.PI / 6, Math.PI * 5 / 6];
  const cs = angs.map(a => [cx + Math.cos(a) * d, cy + Math.sin(a) * d]);
  const zoom = E.inExpo(P(t, 17.4, 18.0));
  const sc = 1 + zoom * 14;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
  cs.forEach((c, i) => {
    circle(c[0], c[1], r, rgba(C.lav, .05 * vp));
    const p = E.inOutCubic(P(t, 15.05 + i * .1, 15.9 + i * .1));
    if (p > 0) { ctx.beginPath(); ctx.arc(c[0], c[1], r, angs[i], angs[i] + p * Math.PI * 2); ctx.strokeStyle = C.lav; ctx.lineWidth = 3 / sc * Math.min(sc, 3); ctx.stroke(); }
  });
  const ip = E.outBack(P(t, 16.05, 16.45));
  if (ip > 0) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cs[0][0], cs[0][1], r, 0, Math.PI * 2); ctx.clip();
    ctx.beginPath(); ctx.arc(cs[1][0], cs[1][1], r, 0, Math.PI * 2); ctx.clip();
    circle(cs[2][0], cs[2][1], r, rgba(C.purple, clamp(ip)));
    ctx.restore();
    text('impact', cx, cy + 12, { size: 30, weight: 700, color: C.paper, align: 'center', alpha: clamp(ip) * (1 - zoom * 3) });
  }
  ctx.restore();
  const la = P(t, 15.6, 16.0) * (1 - P(t, 17.3, 17.5));
  text('DEEP LEARNING', cx, cy - d - r - 34, { size: 22, fam: MONO, color: C.lav, ls: 5, align: 'center', alpha: la });
  text('COMPUTER VISION', cs[1][0] + 150, cs[1][1] + 200, { size: 22, fam: MONO, color: C.lav, ls: 5, align: 'left', alpha: la });
  text('ARTIFICIAL INTELLIGENCE', cs[2][0] - 150, cs[2][1] + 200, { size: 22, fam: MONO, color: C.lav, ls: 5, align: 'right', alpha: la });
  const out = 17.3;
  const w1 = measure('Where algorithms meet ', 46, 500), w2 = measure('real-world impact.', 46, 500);
  const x0 = cx - (w1 + w2) / 2;
  riseLine('Where algorithms meet ', x0, 975, { t, t0: 16.4, size: 46, weight: 500, color: C.paper, out });
  riseLine('real-world impact.', x0 + w1, 975, { t, t0: 16.5, size: 46, weight: 500, color: C.lav, out });
  if (t > 17.85) withAlpha(P(t, 17.85, 18), () => bg(C.purple));
}

// ───────────────────────────── 03 JOURNEY (18–22) ─────────────────────────────
const geo = (lat, lon) => [520 + (lon - 79.86) * 36.7, 560 + (6.93 - lat) * 36.7];
function sJourney(t) {
  bg(C.paper);
  dotGrid(40, rgba(C.ink, .07));
  // latitude lines
  [[10, '10°N'], [5, '5°N'], [0, '0° EQUATOR']].forEach(([lat, lab], i) => {
    const y = geo(lat, 80)[1], p = E.inOutExpo(P(t, 18.05 + i * .08, 18.7 + i * .08));
    ctx.save(); ctx.setLineDash([3, 9]); ctx.beginPath(); ctx.moveTo(150, y); ctx.lineTo(150 + 1620 * p, y);
    ctx.strokeStyle = rgba(C.ink, .22); ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    text(lab, 150, y - 10, { size: 15, fam: MONO, color: C.muted, ls: 2, alpha: p });
  });
  let x0 = 150;

// ───────────────────────────── 05 TOOLKIT (40–46) ─────────────────────────────
const TOOLS = ['Python', 'PyTorch', 'TensorFlow', 'Keras', 'OpenCV', 'MediaPipe', 'Hugging Face', 'LangChain', 'LangGraph', 'Kotlin', 'Android', 'C++', 'Arduino', 'PyPI'];
const RINGS = [{ rx: 600, ry: 235, tilt: -.05, n: 4, spd: .5 }, { rx: 790, ry: 305, tilt: .04, n: 5, spd: -.34 }, { rx: 940, ry: 372, tilt: -.02, n: 5, spd: .24 }];
function sTools(t) {
  bg(C.paper);
  dotGrid(48, rgba(C.ink, .05));
  const cx = 960, cy = 540;
  const col = E.inExpo(P(t, 44.95, 45.55));
  const items = []; let k = 0;
  RINGS.forEach((r, ri) => {
    const dp = E.inOutCubic(P(t, 40.15 + ri * .1, 41.0 + ri * .1)) * (1 - col);
    if (dp > 0) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(r.tilt);

// ───────────────────────────── HUD & finishing ─────────────────────────────
const SECTIONS = [[0, '00 — SIGNAL'], [6, '01 — HELLO'], [12, '02 — PHILOSOPHY'], [18, '03 — JOURNEY'], [22, '04 — SELECTED WORK'], [40, '05 — TOOLKIT'], [46, '06 — HIGHLIGHTS'], [52, '07 — CONTACT']];
function darkAt(t) {

  if (t < 40) return true; if (t < 46) return false; if (t < 52) return isDarkBg(CARDS[clamp(Math.floor((t - 46) / .5), 0, 11)].bg);

  });
}
const GRAIN = Array.from({ length: 6 }, (_, g) => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), d = x.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = h1(i * 7 + g * 99991) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
});
let VIG;
function finish(t) {
  const f = Math.floor(t * FPS);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07;
  ctx.fillStyle = ctx.createPattern(GRAIN[f % 6], 'repeat');
  ctx.translate((h1(f) * 256) | 0, (h1(f + 1) * 256) | 0); ctx.fillRect(-256, -256, W + 512, H + 512);
  ctx.restore();

  ctx.globalAlpha = darkAt(t) ? .35 : .05; ctx.fillStyle = VIG; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
}

const HITS = [6.0, 12.0, 18.0, 22.0, 40.0, 52.0, ...Array.from({ length: 12 }, (_, i) => 46 + i * .5)];
function shake(t) {
  let x = 0, y = 0;
  for (const h of HITS) { const d = t - h; if (d >= 0 && d < .4) { const a = (h >= 46 && h < 52 ? 7 : 12) * Math.exp(-d * 14); x += noise1(t * 60 + h) * a; y += noise1(t * 60 + h + 50) * a; } }
  return { x, y };
}

function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const sh = shake(t); ctx.translate(sh.x, sh.y);
  if (t < 6) sBoot(t); else if (t < 12) sHello(t); else if (t < 18) sPhilo(t); else if (t < 22) sJourney(t);
  else if (t < 40) sWork(t); else if (t < 46) sTools(t); else if (t < 52) sRapid(t); else sOutro(t);
  transitions(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  hud(t); finish(t);
}

    btn.style.display = 'none';
    let t0 = performance.now();
    audio.currentTime = 0; audio.play().catch(() => {});
    const loop = () => {
      const t = !audio.paused && audio.readyState > 2 ? audio.currentTime : (performance.now() - t0) / 1000;
      render(t);
      if (t < DUR) requestAnimationFrame(loop); else btn.style.display = 'flex';
    };
    loop();
  };
}
</script>
</body>
</html>
